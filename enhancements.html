<style>
    /* Particles background */
    #particles-js {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
        z-index: -1; pointer-events: none;
    }
    
    /* Chess board background pattern */
    body::before {
        content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background-image: linear-gradient(rgba(245,240,224,0.1) 1px, transparent 1px),
                         linear-gradient(90deg, rgba(245,240,224,0.1) 1px, transparent 1px);
        background-size: 100px 100px; pointer-events: none; z-index: -2;
    }

    /* Enhanced body gradient */
    body {
        background: linear-gradient(135deg, #F5F0E0 0%, #f0e8d8 100%);
    }

    /* Floating Chess Pieces */
    .floating-pieces { 
        position: fixed; width: 100%; height: 100%; 
        pointer-events: none; overflow: hidden; z-index: -1;
    }
    .floating-piece { 
        position: absolute; font-size: 2rem; opacity: 0.1; 
        animation: pieceFloat 6s ease-in-out infinite; color: #1A1A1A;
    }
    @keyframes pieceFloat { 
        0%, 100% { transform: translateY(0) rotate(0deg); } 
        50% { transform: translateY(-20px) rotate(10deg); } 
    }

    /* GTOUCH ANIMATIONS */
    .gtouch-hover { transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); }
    .gtouch-hover:hover { transform: scale(1.02); }
    .gtouch-tap { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
    .gtouch-tap:active { transform: scale(0.95); opacity: 0.9; }
    .gtouch-ripple { position: relative; overflow: hidden; }
    .gtouch-ripple::after { 
        content: ''; position: absolute; top: 50%; left: 50%; 
        width: 0; height: 0; background: rgba(255,255,255,0.3); 
        border-radius: 50%; transform: translate(-50%, -50%); 
        transition: width 0.6s ease, height 0.6s ease; 
    }
    .gtouch-ripple:active::after { width: 300%; height: 300%; }
    .chess-piece-drag { cursor: grab; transition: all 0.2s ease; }
    .chess-piece-drag:active { cursor: grabbing; transform: scale(1.05); }

    /* Enhanced animations */
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes slideIn { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes bounce { 0%, 20%, 50%, 80%, 100% { transform: translateY(0); } 40% { transform: translateY(-5px); } 60% { transform: translateY(-3px); } }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
    
    /* Header scroll effect */
    .site-header.scrolled {
        box-shadow: 0 2px 20px rgba(0, 0, 0, 0.1); 
        background: rgba(245, 240, 224, 0.98);
    }
    
    /* Hero enhancements */
    .hero { padding: 6rem 0 4rem; position: relative; overflow: hidden; }
    .hero::before { 
        content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
        background: radial-gradient(ellipse at center, transparent 0%, rgba(192, 57, 43, 0.05) 100%); 
        pointer-events: none;

    .hero-copy { animation: fadeInUp 0.8s ease-out; }
    .hero-eval { animation: slideIn 0.6s ease-out 0.2s both; }
    .hero-eval-symbol { animation: bounce 2s infinite; }
    .hero-title::after { 
        content: ''; position: absolute; bottom: -10px; left: 0;

    .hero-subtitle { animation: fadeIn 1s ease-out 0.4s both; }
    .hero-cta::before { 
        content: ''; position: absolute; top: 0; left: -100%; 
        width: 100%; height: 100%; 
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent); 
        transition: left 0.5s ease; 
    }
    .hero-cta:hover::before { left: 100%; }
    
    /* Chess board enhancements */
    .chess-diagram {

    /* Video Section */
    .video-section {

        position: relative; overflow: hidden;
    }
    .video-container {

        box-shadow: 0 20px 60px rgba(0,0,0,0.5); transition: all 0.3s ease;

    .video-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
    .video-overlay {

        background: linear-gradient(45deg, rgba(192,57,43,0.8) 0%, rgba(160,48,32,0.8) 100%); 
        display: flex; align-items: center; justify-content: center; opacity: 0; 
        transition: opacity 0.3s ease;
    }
    .video-container:hover .video-overlay { opacity: 1; }
    .video-title { 
        text-align: center; color: #F5F0E0; margin-top: 2rem; 
        font-family: 'Cormorant Garamond', serif; font-weight: 700; 
        font-size: 1.5rem; letter-spacing: 0.05em; text-transform: uppercase;

    .video-decoration {

        color: rgba(192,57,43,0.3); animation: float 3s ease-in-out infinite;
    }
    
    /* Enhanced buttons and hover effects */
    .header-nav a::after { 
        content: ''; position: absolute; bottom: 0; left: 50%;

    .header-nav a:hover::after { width: 100%; }
    
    /* Enhanced table and card animations */
    .round-item { transition: all 0.3s ease; cursor: pointer; }

    /* Compliance bar enhancements */
    .compliance-pill { padding: 0.5rem 1rem; border-radius: 20px; transition: all 0.3s ease; }
    .compliance-pill:hover { transform: scale(1.05); }
    
    /* Footer enhancements */
    .footer-cta:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(192,57,43,0.3); }
    
    /* Loading spinner */
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .loading-spinner { 
        display: inline-block; width: 20px; height: 20px;

<script>
// Particles.js configuration for chess-themed particles
particlesJS('particles-js', {
    "particles": {
        "number": {"value": 60, "density": {"enable": true, "value_area": 800}},
        "color": {"value": ["#C0392B", "#1A1A1A", "#FFD700", "#C0C0C0", "#CD7F32"]},
        "shape": {
            "type": "char",
            "character": {"value": ["♙", "♟", "♖", "♜", "♘", "♞", "♗", "♝", "♕", "♛", "♔"]}
        },
        "opacity": {"value": 0.1, "random": true, "anim": {"enable": true, "speed": 1, "opacity_min": 0.05, "sync": false}},
        "size": {"value": 15, "random": true, "anim": {"enable": true, "speed": 2, "size_min": 8, "sync": false}},
        "line_linked": {"enable": false},
        "move": {
            "enable": true, "speed": 1, "direction": "none", "random": true, "straight": false,
            "out_mode": "out", "bounce": false
        }
    },
    "interactivity": {
        "detect_on": "canvas",
        "events": {
            "onhover": {"enable": true, "mode": "repulse"},
            "onclick": {"enable": true, "mode": "push"},
            "resize": true
        },
        "modes": {
            "repulse": {"distance": 200, "duration": 0.4},
            "push": {"particles_nb": 4}
        }
    },
    "retina_detect": true
});

// Header scroll effect
var siteHeader = document.getElementById('siteHeader');
window.addEventListener('scroll', function() {
    if (window.scrollY > 100) {
        siteHeader.classList.add('scrolled');
    } else {
        siteHeader.classList.remove('scrolled');
    }
});

// Parallax effect for floating pieces
window.addEventListener('mousemove', function(e) {
    var pieces = document.querySelectorAll('.floating-piece');
    var mouseX = e.clientX / window.innerWidth;
    var mouseY = e.clientY / window.innerHeight;
    
    pieces.forEach(function(piece, index) {
        var offsetX = (mouseX - 0.5) * 20 * (index + 1);
        var offsetY = (mouseY - 0.5) * 20 * (index + 1);
        piece.style.transform = `translate(${offsetX}px, ${offsetY}px)`;
    });
});

// Touch haptic feedback
function addHapticFeedback() {
    if ('vibrate' in navigator) {
        document.querySelectorAll('.gtouch-tap, .gtouch-long-press').forEach(function(element) {
            element.addEventListener('touchstart', function() {
                navigator.vibrate([20]);
            });
        });
    }
}
addHapticFeedback();

// Existing JavaScript remains the same - just add the above enhancements
</script>
